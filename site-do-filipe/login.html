<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente - Login e Registo</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-tabs">
            <button id="btn-login-tab" class="tab-btn active" onclick="switchTab('login')">Iniciar Sessão</button>
            <button id="btn-reg-tab" class="tab-btn" onclick="switchTab('register')">Criar Conta</button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="login-form" class="auth-box active">
            <h2>Bem-vindo de volta</h2>
            <p class="subtitle">Insira as suas credenciais para aceder à sua conta.</p>
            
            <form onsubmit="handleAuthStep(event)">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" required placeholder="exemplo@email.com">
                </div>
                <div class="input-group">
                    <label>Palavra-passe</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" class="forgot-pass">Esqueceu-se da senha?</a>
                </div>
                <button type="submit" class="btn-auth">Continuar</button>
            </form>
        </div>

        <!-- FORMULÁRIO DE REGISTO -->
        <div id="register-form" class="auth-box">
            <h2>Criar uma nova conta</h2>
            <p class="subtitle">Registe-se em menos de um minuto para começar.</p>
            
            <form onsubmit="handleAuthStep(event)">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" required placeholder="O seu nome">
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" required placeholder="exemplo@email.com">
                </div>
                <div class="input-group">
                    <label>Palavra-passe</label>
                    <input type="password" required placeholder="Mínimo 8 caracteres">
                </div>
                <button type="submit" class="btn-auth">Registar e Configurar 2FA</button>
            </form>
        </div>

        <!-- ECRÃ DE 2FA -->
        <div id="2fa-form" class="auth-box">
            <div class="security-icon">🔒</div>
            <h2>Verificação de Segurança</h2>
            <p class="subtitle">Introduza o código de 6 dígitos da sua aplicação de autenticação.</p>
            
            <form onsubmit="handleFinalLogin(event)">
                <div class="input-group">
                    <input type="text" maxlength="6" placeholder="000000" class="code-input" required>
                </div>
                <button type="submit" class="btn-auth btn-verify">Verificar e Entrar</button>
                <a href="#" class="back-link" onclick="backToInit()">Voltar ao início</a>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-box').forEach(box => box.classList.remove('active'));
            
            if(tab === 'login') {
                document.getElementById('login-form').classList.add('active');
                document.getElementById('btn-login-tab').classList.add('active');
            } else {
                document.getElementById('register-form').classList.add('active');
                document.getElementById('btn-reg-tab').classList.add('active');
            }
        }

        function handleAuthStep(event) {
            event.preventDefault();
            document.querySelectorAll('.auth-box').forEach(box => box.classList.remove('active'));
            document.getElementById('2fa-form').classList.add('active');
        }

        function backToInit() {
            document.getElementById('2fa-form').classList.remove('active');
            switchTab('login');
        }

        function handleFinalLogin(event) {
            event.preventDefault();
            alert('Sucesso! Login efetuado com segurança 2FA.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
